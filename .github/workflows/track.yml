name: ETF Holdings Tracker

on:
  schedule:
    - cron: "0 12 * * 1-5" # Taiwan time 20:00 (UTC+8), Mon-Fri
  workflow_dispatch:

concurrency:
  group: etf-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.59.0-noble

    steps:
      - uses: actions/checkout@v4

      - name: Restore previous holdings data
        uses: actions/cache@v4
        with:
          path: data/
          key: etf-data-${{ runner.os }}
          restore-keys: etf-data-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Sync holdings to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python notion_sync.py

      - name: Save holdings data
        uses: actions/cache/save@v4
        with:
          path: data/
          key: etf-data-${{ runner.os }}-${{ github.run_id }}
